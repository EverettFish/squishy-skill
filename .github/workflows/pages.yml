name: Squishy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble both playgrounds
        run: |
          mkdir -p _site/tata
          cp -R examples/nailong/web/. _site/
          cp -R examples/tata/web/. _site/tata/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish the little squishy
        id: deployment
        uses: actions/deploy-pages@v4
